# Frame Format (ModelViz Studio): how to decode one Device. Lives in the Project, e.g.
# frame-formats/<device>.yaml, next to dialects/<device>.xml.
framing: mavlink2
dialect: ../dialects/bench.xml          # relative to this file

# No telemetry is accepted until the Device reports the dialect hash in this Field.
dialectCheck: { message: DIALECT_INFO, field: hash }

messages:
  HEARTBEAT:
    nominalRateHz: 1

  # One sample per frame, timed by the Device.
  BENCH_STATE:
    deviceTimestamp: { field: time_us, unit: us }   # us | ms | s
    nominalRateHz: 500

  # 8 samples per frame at 1 kHz; element 0 is at time_us.
  BENCH_IMU_BATCH:
    deviceTimestamp: { field: time_us, unit: us }
    nominalRateHz: 125
    batch:
      fields: [gyro_x, gyro_y, gyro_z]
      sampleRateHz: 1000
      # or, when the Device's sample interval varies:
      # intervalField: { field: dt_us, unit: us }
